name: Gerar EXE do 2048

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar Pygame e PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Verificar jogo
        run: |
          python -m py_compile 2048_cores_novas.py

      - name: Criar EXE
        run: |
          pyinstaller --onefile --windowed --name 2048 2048_cores_novas.py

      - name: Enviar EXE
        uses: actions/upload-artifact@v4
        with:
          name: 2048-Windows
          path: dist/2048.exe
